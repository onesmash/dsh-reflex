<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="Hiragino Sans GB, Helvetica Neue, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Header -->
  <text x="60" y="62" font-size="22" font-weight="bold" fill="#e6edf3">dsh-reflex</text>
  <text x="216" y="62" font-size="16" fill="#6e7681">L1 decides → L2 acts</text>
  <rect x="1026" y="42" width="114" height="26" rx="13" fill="none" stroke="#30363d"/>
  <text x="1083" y="60" font-size="14" fill="#6e7681" text-anchor="middle">illustrative</text>

  <!-- Card 1: L1 notification -->
  <rect x="60" y="96" width="1080" height="300" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="60" y="96" width="5" height="300" rx="2.5" fill="#58a6ff"/>
  <text x="92" y="134" font-size="17" font-weight="bold" fill="#58a6ff">Layered Agent · L1 · Disk storage</text>
  <text x="1108" y="134" font-size="15" fill="#6e7681" text-anchor="end">00:12</text>
  <line x1="92" y1="150" x2="1108" y2="150" stroke="#21262d"/>

  <text x="92" y="182" font-size="16" fill="#e6edf3">An event worth interrupting for</text>

  <text x="92" y="218" font-size="15" fill="#8b949e">status</text>
  <text x="176" y="218" font-size="15" fill="#c9d1d9">11.8GB free / 448GB used (97%) / 460GB total</text>

  <text x="92" y="248" font-size="15" fill="#8b949e">trend</text>
  <text x="176" y="248" font-size="15" fill="#c9d1d9">Δ-38.4GB across 120 samples</text>

  <text x="92" y="278" font-size="15" fill="#8b949e">swap</text>
  <text x="176" y="278" font-size="15" fill="#c9d1d9">21.0GB used / 21.0GB on disk / 20 swapfiles</text>

  <text x="92" y="308" font-size="15" fill="#8b949e">read</text>
  <text x="176" y="308" font-size="15" fill="#c9d1d9">Free space fell 38.4GB — 18.2GB of it is swap growth</text>

  <text x="92" y="338" font-size="15" fill="#8b949e">rule</text>
  <text x="176" y="338" font-size="15" fill="#c9d1d9">free &lt; 20GB or used &gt; 90%</text>

  <text x="92" y="366" font-size="14" fill="#d29922">(hard rule · punches through quiet hours)</text>

  <!-- Card 2: L2 action -->
  <rect x="60" y="420" width="1080" height="164" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="60" y="420" width="5" height="164" rx="2.5" fill="#3fb950"/>
  <text x="92" y="458" font-size="17" font-weight="bold" fill="#3fb950">Chief</text>
  <text x="156" y="458" font-size="14" fill="#6e7681">L2</text>
  <text x="1108" y="458" font-size="15" fill="#6e7681" text-anchor="end">00:13</text>
  <line x1="92" y1="474" x2="1108" y2="474" stroke="#21262d"/>

  <text x="92" y="506" font-size="15" fill="#c9d1d9">Disk is at 97%. 18.2GB of that is swap growing to 21GB — not your files.</text>
  <text x="92" y="534" font-size="15" fill="#c9d1d9">Cleared DerivedData and two old simulator images: 24GB back.</text>
  <text x="92" y="562" font-size="15" fill="#7ee787">36GB free now. Swap only returns on reboot, so I left it alone.</text>

  <!-- Footer -->
  <text x="60" y="632" font-size="17" fill="#8b949e">L1 decides, L2 acts — nobody was asked</text>
  <text x="1140" y="632" font-size="16" fill="#6e7681" text-anchor="end">github.com/onesmash/dsh-reflex</text>
</svg>
