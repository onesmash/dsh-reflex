<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="Hiragino Sans GB, Helvetica Neue, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Title -->
  <text x="60" y="84" font-size="42" font-weight="bold" fill="#e6edf3">dsh-reflex</text>
  <text x="60" y="120" font-size="19" fill="#8b949e">A reflex arc for your Bot — a decision made without the brain</text>

  <!-- Cheap zone -->
  <rect x="60" y="165" width="700" height="255" rx="16" fill="#0f2417" stroke="#2ea043" stroke-opacity="0.5"/>
  <text x="88" y="203" font-size="18" font-weight="bold" fill="#3fb950">always running · nearly free</text>

  <rect x="88" y="230" width="190" height="118" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="183" y="281" font-size="20" font-weight="bold" fill="#e6edf3" text-anchor="middle">Sources</text>
  <text x="183" y="309" font-size="14" fill="#8b949e" text-anchor="middle">scripts · auto-discovered</text>

  <line x1="282" y1="289" x2="301" y2="289" stroke="#3fb950" stroke-width="2" marker-end="url(#ag)"/>

  <rect x="305" y="230" width="190" height="118" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="400" y="281" font-size="20" font-weight="bold" fill="#e6edf3" text-anchor="middle">L0 fact layer</text>
  <text x="400" y="309" font-size="14" fill="#8b949e" text-anchor="middle">append-only · traceable</text>

  <line x1="499" y1="289" x2="518" y2="289" stroke="#3fb950" stroke-width="2" marker-end="url(#ag)"/>

  <rect x="522" y="230" width="214" height="118" rx="12" fill="#0f2417" stroke="#3fb950"/>
  <text x="629" y="275" font-size="20" font-weight="bold" fill="#e6edf3" text-anchor="middle">L1 decision layer</text>
  <text x="629" y="303" font-size="14" fill="#7ee787" text-anchor="middle">local decision model</text>
  <text x="629" y="325" font-size="13" fill="#8b949e" text-anchor="middle">~0.3s · offline · no tokens</text>

  <!-- Gate -->
  <line x1="780" y1="158" x2="780" y2="392" stroke="#58a6ff" stroke-width="2" stroke-dasharray="7 7"/>
  <rect x="666" y="118" width="228" height="32" rx="16" fill="#0d1117" stroke="#1f6feb"/>
  <text x="780" y="140" font-size="16" font-weight="bold" fill="#58a6ff" text-anchor="middle">clears the bar → wake</text>

  <!-- Expensive zone -->
  <rect x="800" y="165" width="340" height="255" rx="16" fill="#241a08" stroke="#d29922" stroke-opacity="0.5"/>
  <text x="828" y="203" font-size="18" font-weight="bold" fill="#d29922">only when needed</text>

  <rect x="828" y="230" width="284" height="118" rx="12" fill="#161b22" stroke="#d29922"/>
  <text x="970" y="275" font-size="20" font-weight="bold" fill="#e6edf3" text-anchor="middle">L2 reasoning layer</text>
  <text x="970" y="303" font-size="14" fill="#e3b341" text-anchor="middle">Bot · LLM</text>
  <text x="970" y="325" font-size="13" fill="#8b949e" text-anchor="middle">decides whether to interrupt a human</text>

  <!-- Quiet path -->
  <line x1="629" y1="350" x2="629" y2="462" stroke="#3fb950" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#ag)"/>
  <text x="645" y="405" font-size="15" fill="#7ee787">not worth it → stay quiet</text>

  <!-- Bottom -->
  <rect x="60" y="470" width="1080" height="130" rx="16" fill="#161b22" stroke="#30363d"/>
  <text x="88" y="516" font-size="24" font-weight="bold" fill="#e6edf3">Most of the time: do nothing, stay quiet</text>
  <text x="88" y="556" font-size="16" fill="#8b949e">L1 keeps 99% of the "not worth it" away from the LLM — no cost, no quota, no context churn</text>
  <text x="1108" y="548" font-size="64" font-weight="bold" fill="#2ea043" opacity="0.5" text-anchor="end">99%</text>

  <!-- 唤醒箭头: 必须画在面板之后, 否则会被右侧面板的填充盖住(踩过) -->
  <line x1="738" y1="289" x2="824" y2="289" stroke="#58a6ff" stroke-width="2" marker-end="url(#am)"/>

  <text x="60" y="640" font-size="16" fill="#6e7681">MIT · runs alongside ds-bot · zero changes to it</text>
  <text x="1140" y="640" font-size="16" fill="#6e7681" text-anchor="end">github.com/onesmash/dsh-reflex</text>
</svg>
